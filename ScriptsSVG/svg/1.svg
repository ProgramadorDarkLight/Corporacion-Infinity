<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo de color suave -->
  <rect width="100%" height="100%" fill="#f0f0f0" rx="15" />

  <!-- Un círculo decorativo -->
  <circle cx="150" cy="80" r="40" fill="#4CAF50" stroke="#2E7D32" stroke-width="3" />

  <!-- El texto "Hola Mundo" -->
  <text x="150" y="140" font-family="Arial" font-size="24" fill="#333" text-anchor="middle">
    ¡Hola Mundo desde SVG!
  </text>
</svg>